<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BREAK FORD — Break Barriers. Cross Boundaries.</title>
<meta name="description" content="BREAK FORD — cues, cases & bags, tables and accessories for players who value precision, control and consistency.">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="intro" aria-label="BREAK FORD">
  <video id="introVideo" muted playsinline preload="metadata" aria-hidden="true"></video>
  <div class="shade"></div>
  <div class="stage">
    <div class="logo-box"><img src="assets/logo-2x.webp" alt="BREAK FORD"></div>
    <div class="tag"><span>BREAK BARRIERS.</span> <span>CROSS BOUNDARIES.</span></div>
  </div>
  <button class="skip" id="skipIntro" type="button">Skip intro</button>
</div>

<header class="site" id="hdr">
  <div class="wrap bar">
    <a class="brand" href="#" id="homeLink" aria-label="BREAK FORD home"><img src="assets/logo-2x.webp" alt="BREAK FORD" width="1902" height="225"></a>
    <nav class="main" id="nav" aria-label="Products"></nav>
    <div class="tools">
      <button class="icon-btn" id="searchBtn" aria-label="Search" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn" id="cartBtn" aria-label="Open cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 7h14l-1.2 12.2a1.8 1.8 0 0 1-1.8 1.6H8a1.8 1.8 0 0 1-1.8-1.6z"/><path d="M9 7V6a3 3 0 0 1 6 0v1"/></svg>
        <span class="badge" id="cartCount" hidden>0</span>
      </button>
      <button class="btn btn-gold btn-sm hdr-cta" data-enquire>Enquire now</button>
      <button class="icon-btn burger" id="burger" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h18M3 16h18"/></svg>
      </button>
    </div>
  </div>
  <div class="search-row" id="searchRow">
    <form class="wrap" id="searchForm" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--dim)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search cues, cases, tables, accessories" aria-label="Search products">
      <button class="link" type="submit">Search</button>
    </form>
  </div>
</header>

<div id="mnav" aria-hidden="true"><div class="scrim" data-close></div><div class="panel" role="dialog" aria-label="Menu">
  <div class="m-head"><img src="assets/logo-2x.webp" alt="BREAK FORD"><button class="icon-btn" data-close aria-label="Close menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div>
  <form id="mSearch" class="m-search"><input id="mq" type="search" placeholder="Search products" aria-label="Search products"></form>
  <div id="mCats"></div>
  <div class="m-links"><button data-to="#about">About BREAK FORD</button><button data-to="#sizes">Table size guide</button><button data-to="#joints">Cue case guide</button></div>
  <div class="m-foot"><button class="btn btn-gold" data-enquire>Enquire now</button></div>
</div></div>

<main id="view"></main>

<footer>
  <div class="wrap">
    <div class="foot-top">
      <div><img src="assets/logo-2x.webp" alt="BREAK FORD"><div class="tl">BREAK BARRIERS. CROSS BOUNDARIES.</div></div>
      <button class="btn btn-gold" data-enquire>Enquire now <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
    </div>
    <div class="foot">
      <div><h6>Products</h6><ul id="footShop"></ul></div>
      <div><h6>Guides</h6><ul><li><button data-to="#sizes">Table size guide</button></li><li><button data-to="#joints">Cue case guide</button></li></ul></div>
      <div><h6>Company</h6><ul><li><button data-to="#about">About BREAK FORD</button></li><li><button data-enquire>Enquiries</button></li></ul></div>
      <div><h6>Principles</h6><p>Precision.<br>Purpose.<br>Progress.</p></div>
    </div>
    <div class="fine"><span>© 2026 BREAK FORD. All rights reserved.</span><span>Prices in INR, inclusive of GST.</span></div>
  </div>
</footer>

<div id="drawer" aria-hidden="true"><div class="scrim" data-close></div><div class="panel" role="dialog" aria-label="Cart">
  <div class="dhead"><h3 id="dTitle">Your cart</h3><button class="icon-btn" data-close aria-label="Close cart"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 5l14 14M19 5 5 19"/></svg></button></div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot" id="dFoot"></div>
</div></div>

<div id="toast" role="status" aria-live="polite"></div>
<script src="js/app.js"></script>
</body>
</html>
